# CI: runs every check on a fresh machine for each PR to main and each push to main.
# Spec: docs/features/phase0-ci.md
#
# Branch protection requires the checks by JOB ID: backend, mobile, docker.
# Renaming a job (or adding `name:` to it) means updating the ruleset in the same change,
# otherwise every PR waits forever for a check that no longer exists.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the token can only read the repo. Every unlisted scope is "none".
permissions:
  contents: read

# PRs share one group per PR, so a newer push cancels the stale run.
# Every other run (push to main, manual) gets its own group (run_id): GitHub keeps only one
# pending run per group and cancels older pending ones even with cancel-in-progress: false,
# so a shared group would silently skip commits on main.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (SDK from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/FlowPilot.sln

      # TreatWarningsAsErrors (Directory.Build.props) makes any warning fail this step.
      # The build also regenerates backend/openapi/flowpilot.json.
      - name: Build
        run: dotnet build backend/FlowPilot.sln --no-restore

      - name: OpenAPI drift check (commit backend/openapi/flowpilot.json if this fails)
        run: |
          # Guard: a moved/renamed file would make the porcelain check pass silently.
          test -f backend/openapi/flowpilot.json || { echo "::error::backend/openapi/flowpilot.json not found"; exit 1; }
          if [ -n "$(git status --porcelain backend/openapi/)" ]; then
            git status --porcelain backend/openapi/
            git diff backend/openapi/
            echo "::error::backend/openapi/ is out of date. Run 'dotnet build backend/FlowPilot.sln' and commit the result."
            exit 1
          fi

      - name: Unit + architecture tests
        run: dotnet test backend/FlowPilot.sln --no-build --filter "Category!=Integration"

      # Testcontainers starts a throwaway postgres:17 on the runner's built-in Docker.
      - name: Integration tests
        run: dotnet test backend/FlowPilot.sln --no-build --filter "Category=Integration"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: 1
    # Applies to `run:` steps only; paths in action `with:` inputs stay relative to the repo root.
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # npm ci installs exactly package-lock.json and fails if it disagrees with package.json.
      - name: Install
        run: npm ci

      - name: Client drift check (run 'npm run gen:api' and commit if this fails)
        run: |
          npm run gen:api
          test -f src/lib/api/schema.d.ts || { echo "::error::mobile/src/lib/api/schema.d.ts not found"; exit 1; }
          if [ -n "$(git status --porcelain src/lib/api/)" ]; then
            git status --porcelain src/lib/api/
            git diff src/lib/api/
            echo "::error::mobile/src/lib/api is out of date with backend/openapi/flowpilot.json. Run 'npm --prefix mobile run gen:api' and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (mobile)
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci

      # Builds the static web bundle Cloudflare Pages will host (output discarded with the VM).
      # Same script Cloudflare Pages runs. It requires EXPO_PUBLIC_API_URL; .invalid is a reserved
      # TLD (RFC 2606) that never resolves, so this placeholder can't reach anything.
      - name: Web build check
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: npm run export:web

      # Mirrors .claude/hooks/format.mjs (root .prettierrc.json for everything outside mobile/).
      # Keep the extension list in sync with the hook. Both ignore files are passed because an
      # explicit --ignore-path replaces Prettier's default of reading .gitignore.
      - name: Format check (rest of repo)
        working-directory: .
        run: >-
          node mobile/node_modules/prettier/bin/prettier.cjs --check
          --ignore-path .gitignore --ignore-path .prettierignore
          "**/*.{md,json,yml,yaml,css,mjs}" "!mobile/**"

  # Proves the image Render will build still builds. No registry login, nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f backend/Dockerfile -t flowpilot-api:ci backend

  # Continuous deployment: ships main to production once every CI job is green.
  # Order matters: migrate -> deploy -> verify. Spec: docs/features/phase0-deploy.md, ADR-0003.
  # Not a required check: it never runs on PRs.
  deploy:
    needs: [backend, mobile, docker]
    # Manual runs on main redeploy (first deploy, after rotating a secret). PR runs never deploy, and
    # the production environment's branch policy (main only) withholds secrets even if this line is edited.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.API_BASE_URL }}/health/version
    # Deploys never overlap and a running one is never killed halfway. GitHub keeps only the newest
    # pending deploy. Groups don't order runs, though: the "Skip if main moved on" step stops an older
    # commit whose CI finished last from rolling production back.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    # Secrets reach scripts through env and are quoted as "$VAR", never interpolated with ${{ }}.
    # Never enable `set -x` here: it would echo the hook URL and connection string.
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      # Each push to main gets its own CI run, so CI for an older commit can finish after a newer one.
      # Only the commit main points at right now may deploy; the run for that commit deploys it.
      # Trade-off: if the newer commit's CI fails, neither deploys (fix forward or re-run).
      - name: Skip if main moved on
        id: head
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $head, newer than $GITHUB_SHA; that commit's run deploys it."
          fi

      - name: Checkout
        if: steps.head.outputs.stale != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (SDK from global.json)
        if: steps.head.outputs.stale != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: steps.head.outputs.stale != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check deploy configuration
        if: steps.head.outputs.stale != 'true'
        env:
          NEON_MIGRATIONS_CONNECTION_STRING: ${{ secrets.NEON_MIGRATIONS_CONNECTION_STRING }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          missing=0
          for name in NEON_MIGRATIONS_CONNECTION_STRING RENDER_DEPLOY_HOOK_URL API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment (see docs/runbooks/deploy.md)."
              missing=1
            fi
          done
          if [ "${API_BASE_URL%/}" != "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL must not end with '/'."
            missing=1
          fi
          exit "$missing"

      - name: Restore tools
        if: steps.head.outputs.stale != 'true'
        run: dotnet tool restore

      # One self-contained executable that applies only the migrations Neon doesn't have yet.
      # Infrastructure is its own startup project: it has the design-time factory and the EF Design
      # package (PrivateAssets, so the Api doesn't get it).
      # `migrations bundle` builds without restoring, and this runner starts with no obj/ folder.
      # Restoring for linux-x64 also fetches the runtime pack the self-contained bundle needs.
      - name: Restore (migration bundle)
        if: steps.head.outputs.stale != 'true'
        run: dotnet restore backend/src/FlowPilot.Infrastructure/FlowPilot.Infrastructure.csproj -r linux-x64

      - name: Build migration bundle
        if: steps.head.outputs.stale != 'true'
        run: >-
          dotnet ef migrations bundle
          -p backend/src/FlowPilot.Infrastructure -s backend/src/FlowPilot.Infrastructure
          -o efbundle --self-contained -r linux-x64

      # Neon's DIRECT endpoint: EF needs session-level locks that PgBouncer's transaction pooling breaks.
      # Runs before the deploy, so every migration must work with the version currently live
      # (expand/contract).
      - name: Apply migrations (Neon)
        if: steps.head.outputs.stale != 'true'
        env:
          NEON_MIGRATIONS_CONNECTION_STRING: ${{ secrets.NEON_MIGRATIONS_CONNECTION_STRING }}
        run: ./efbundle --connection "$NEON_MIGRATIONS_CONNECTION_STRING"

      # The hook URL already carries its key as a query parameter, hence "&ref=". ref pins the build to
      # exactly the commit CI tested. Output is discarded so nothing derived from the URL is logged.
      - name: Trigger Render deploy
        if: steps.head.outputs.stale != 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST -o /dev/null "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA"

      # A healthy /health/live could still be the OLD version (Render keeps it when a deploy fails).
      # Only the commit reported by the running app proves the new code is live.
      - name: Verify deployed version
        if: steps.head.outputs.stale != 'true'
        run: |
          deadline=$((SECONDS + 900))
          seen=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            # Errors and non-2xx mean "not yet": the service is expected to be briefly unavailable.
            # --max-time 90 covers a cold start (~1 min) without letting one request hang the loop.
            body=$(curl -fsS --max-time 90 "$API_BASE_URL/health/version" 2>/dev/null || true)
            seen=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$seen" = "$GITHUB_SHA" ]; then
              echo "Production is running $GITHUB_SHA."
              exit 0
            fi
            echo "Waiting for $GITHUB_SHA; live commit is '${seen:-unreachable}'."
            sleep 15
          done
          echo "::error::Production did not report $GITHUB_SHA within 15 minutes (last seen: '${seen:-unreachable}'). Check the Render deploy log."
          exit 1

      # New code is live; now prove it can reach Neon with the runtime connection string.
      # The instance is already awake, so 20 s per attempt is plenty and the worst case stays well
      # inside timeout-minutes (a real failure shows curl's error, not a job timeout).
      - name: Verify readiness
        if: steps.head.outputs.stale != 'true'
        run: >-
          curl -fsS --max-time 20 --retry 5 --retry-delay 10 --retry-all-errors
          -o /dev/null "$API_BASE_URL/health/ready"
