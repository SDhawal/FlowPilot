name: Feature
description: A new capability, with testable acceptance criteria.
title: "feat: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Who wants what, and why.
      placeholder: As a <user>, I want <capability>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One testable Given/When/Then per behaviour, including failure cases.
      placeholder: |
        - **Given** …, **when** …, **then** ….
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not include.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Related ADRs/specs, CLAUDE.md rules this touches (user scoping, AI as suggestion, UTC, rate limits), open questions.
